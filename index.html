<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JWS Masjid ARAFAH — Admin</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="mosque">🕌</div><div><b>JWS</b><span>Jam Masjid Digital</span></div></div>
  <div class="menu-title">MENU UTAMA</div>
  <nav id="nav"></nav>
  <div class="tv-preview">
    <div class="preview-title">PREVIEW LAYAR TV</div>
    <div class="tv-card">
      <div class="tv-mini-head" id="previewMosque">MASJID ARAFAH</div>
      <div class="tv-mini-title">RUKUK BERSAMA<br>ORANG-ORANG YANG RUKUK</div>
      <div class="tv-mini-clock" id="miniClock">00:00:00</div>
      <div class="tv-mini-times"><span>04:29</span><span>04:39</span><span>11:52</span><span>15:13</span><span>17:48</span><span>19:00</span></div>
    </div>
    <button class="tv-open" id="openTv">Buka Layar TV ↗</button>
  </div>
</aside>
<main class="main">
<header class="topbar">
  <div class="top-date"><b id="dateNow"></b><span>08 Safar 1448 H</span></div>
  <div class="top-user"><span class="bell">●<i>3</i></span><div class="avatar">A</div><div><b>Admin Masjid</b><small>Super Admin</small></div></div>
</header>
<section class="content">
  <div class="page-head">
    <div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Selamat datang di Admin Panel JWS Masjid ARAFAH Kranji Munthang</p></div>
    <div class="head-actions">
      <button class="btn green" data-page="announcement">＋ Pengumuman</button>
      <button class="btn blue" data-page="slides">＋ Slide TV</button>
      <button class="btn" data-page="settings">⚙ Pengaturan</button>
    </div>
  </div>
  <div id="pages"></div>
</section>
</main>
</div>
<div id="toast" class="toast"></div>
<script src="admin.js"></script>
</body>
</html>
